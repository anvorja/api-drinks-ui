# Netlify build. Variables (Site configuration → Environment variables):
#   VITE_API_URL=/          the API is reached through the /v1 proxy on this same origin
#   API_ORIGIN=https://…    where the proxy sends /v1/* (the API on Render)
#   VITE_DEMO_ACCOUNTS=true optional: demo accounts on the sign-in screen
# See docs/despliegue.md.
[build]
  command = "pnpm build && node scripts/netlify-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "12.3.4"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"
