name: CI/CD

# CI on every PR to main/develop. The rulesets require the two job names below as status checks.
# CD, once the checks passed, with the very image CI tested (never rebuilt):
#   push to develop → Docker Hub `develop` + `<sha>` (Netlify deploys the staging site by itself).
#   push to main    → Docker Hub `latest` + `<sha>` (production).
# Secrets: DOCKER_USERNAME, DOCKER_TOKEN.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    # The job name is the status check the rulesets require: keep them in sync.
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Formato (prettier)
        run: pnpm format:check
      - name: Análisis de tipos (tsc)
        run: pnpm typecheck
      - name: Lint (eslint)
        run: pnpm lint
      - name: Pruebas unitarias y de componentes
        run: pnpm test
      - name: Cliente tipado al día con openapi/openapi.json
        run: pnpm api:check
      - name: Build
        run: pnpm build
      - name: Configuración de Netlify (proxy de /v1 y fallback de la app)
        # The same script Netlify runs after its build (netlify.toml): checks the rules it writes.
        env:
          API_ORIGIN: https://api.example.test
        run: |
          node scripts/netlify-redirects.mjs
          grep -qxF '/v1/*  https://api.example.test/v1/:splat  200' dist/_redirects
          grep -qxF '/*  /index.html  200' dist/_redirects
          if API_ORIGIN=http://inseguro.test node scripts/netlify-redirects.mjs; then
            echo "::error::netlify-redirects.mjs aceptó un API_ORIGIN sin https"; exit 1
          fi

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: api-drinks-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name ui -p 8080:8080 -e API_URL=https://api.example.test api-drinks-ui:ci
          for _ in $(seq 1 20); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/config.js | grep -q 'https://api.example.test'
          curl -sf http://localhost:8080/mi-adn | grep -q '<div id="root">'
      # On main and develop: the tested image travels to the publish job, which runs once every check passed.
      - name: Guardar la imagen probada
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: docker save api-drinks-ui:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    name: Publicar imagen
    # Push to main or develop, and only after the required checks passed.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [quality, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/api-drinks-ui
      # latest = production (main); develop = staging.
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}
    steps:
      - name: Obtener short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Cargar la imagen probada (no se reconstruye)
        run: gunzip -c image.tar.gz | docker load

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push a Docker Hub (canal y <sha>)
        run: |
          for tag in "$CHANNEL" "${{ steps.vars.outputs.SHORT_SHA }}"; do
            docker tag api-drinks-ui:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          {
            echo "### Imagen publicada"
            echo "- \`$IMAGE:$CHANNEL\` y \`$IMAGE:${{ steps.vars.outputs.SHORT_SHA }}\`"
            echo "- El sitio lo despliega Netlify; esta imagen sirve para correrlo en cualquier otro lado."
          } >> "$GITHUB_STEP_SUMMARY"
