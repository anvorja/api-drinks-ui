name: CI/CD

# CI on every PR to main/develop. The rulesets require the two job names below as status checks.
# CD on push to main/develop: publish the Docker image to GitHub Container Registry.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    # The job name is the status check the rulesets require: keep them in sync.
    name: Calidad y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Formato (prettier)
        run: pnpm format:check
      - name: Análisis de tipos (tsc)
        run: pnpm typecheck
      - name: Lint (eslint)
        run: pnpm lint
      - name: Pruebas unitarias y de componentes
        run: pnpm test
      - name: Cliente tipado al día con openapi/openapi.json
        run: pnpm api:check
      - name: Build
        run: pnpm build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (y push solo en main/develop)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo del contenedor
        if: github.event_name != 'push'
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name ui -p 8080:8080 -e API_URL=https://api.example.test "$image"
          for i in $(seq 1 20); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/config.js | grep -q 'https://api.example.test'
          curl -sf http://localhost:8080/mi-adn | grep -q '<div id="root">'
